{% extends 'base.html' %}
{% block title %}Регистрация — ONNI_MONNI{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <h1>Создать аккаунт</h1>
    <p class="sub">Регистрация — это быстро. Сможете лайкать и комментировать сразу.</p>
    <form method="post">
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus minlength="3">
      </div>
      <div class="form-group">
        <label for="email">Email (необязательно)</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}">
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>
      <div class="form-group">
        <label for="password2">Повторите пароль</label>
        <input type="password" id="password2" name="password2" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
    </form>
    <div class="auth-switch">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></div>
  </div>
</section>
{% endblock %}
